<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0f172a" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#blueTeal)" stroke-width="8" opacity="0.3" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#blueTeal)" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />
  
  <!-- Gear Graphic -->
  <g transform="translate(256, 256) scale(2.8)" filter="url(#glow)">
    <!-- Gear teeth -->
    <path d="M-10,-45 L10,-45 L15,-30 L28,-36 L41,-23 L30,-15 L45,-10 L45,10 L30,15 L41,23 L28,36 L15,30 L10,45 L-10,45 L-15,30 L-28,36 L-41,23 L-30,15 L-45,10 L-45,-10 L-30,-15 L-41,-23 L-28,-36 L-15,-30 Z" fill="url(#blueTeal)" />
    <!-- Inner cutouts -->
    <circle cx="0" cy="0" r="24" fill="#0f172a" />
    
    <!-- Smart tool/Wrench icon inside -->
    <path d="M-10,-10 L-6,-2 C-8,1 -8,4 -6,6 C-3,9 2,9 5,6 C7,4 7,1 5,-2 L9,-10 C14,-7 16,-1 14,5 C11,11 3,13 -3,11 C-8,9 -11,4 -10,-2 Z" fill="#ffffff" />
    <path d="M-8,-16 L8,-16 L12,-6 C6,-9 1,-9 -5,-6 Z" fill="#ffffff" />
    <!-- Handle -->
    <rect x="-3" y="0" width="6" height="28" rx="3" fill="#ffffff" />
    <circle cx="0" cy="22" r="2" fill="#0f172a" />
  </g>
</svg>
